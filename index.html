<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple_touch_icon.png?v=3">
    <title>The Patron</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/spell_cards.css">
    <link rel="stylesheet" href="css/skulls.css">
    <link rel="stylesheet" href="css/consultation.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/spell_overlay.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/spell_library.css">
    <link rel="stylesheet" href="css/manual_override.css">
    <link rel="stylesheet" href="css/binding_sigil.css">
</head>

<body>
    <div class="abyss">
        <div class="abyss_atmosphere"></div>
        <div class="abyss_particles"></div>
    </div>

    <main class="patron_screen">

        <header class="layout_section patron_header">
            <div class="header_content">
                <h1 class="patron_title">Consult the Many</h1>

                <div class="header_decoration">
                    <span class="decoration_line"></span>
                    <span class="header_diamond"></span>
                    <span class="decoration_line"></span>
                </div>
            </div>
        </header>

        <section class="layout_section cantrip_section">
            <div class="spell_row" id="cantrip_row"></div>
        </section>

        <section class="layout_section aspect_section">
            <div class="skull_stage">
                <div class="skull_group" id="skull_group"></div>

                <div class="aspect_labels">
                    <div class="aspect_label" id="aspect_label_0"></div>
                    <div class="aspect_label" id="aspect_label_1"></div>
                    <div class="aspect_label" id="aspect_label_2"></div>
                </div>

                <div class="magic_eruption" id="magic_eruption"></div>
            </div>
        </section>

        <section class="layout_section ritual_section">
            <div class="spell_row" id="ritual_row"></div>
        </section>


        <footer class="layout_section consultation_section">
            <button class="consultation_button" id="consultation_button" type="button" aria-label="Consult The Many">

                <span class="eclipse_corona"></span>
                <span class="eclipse_core"></span>

                <svg class="eclipse_charge" viewBox="0 0 100 100">
                    <circle class="charge_ring" cx="50" cy="50" r="34" pathLength="100" />
                </svg>

                <svg id="binding_sigil" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                    hidden>
                    <defs>
                        <filter id="binding_glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="soft_glow" />

                            <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="wide_glow" />

                            <feMerge>
                                <feMergeNode in="wide_glow" />
                                <feMergeNode in="soft_glow" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                        <filter id="binding_centre_glow" x="-100%" y="-100%" width="300%" height="300%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="inner_glow" />

                            <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="outer_glow" />

                            <feMerge>
                                <feMergeNode in="outer_glow" />
                                <feMergeNode in="inner_glow" />
                                <feMergeNode in="inner_glow" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <g id="binding_outer_ring">
                        <circle cx="100" cy="100" r="92" fill="none" stroke="#E94B67" stroke-width="1.5" />
                        <circle cx="100" cy="100" r="84" fill="none" stroke="#E94B67" stroke-width="0.8"
                            stroke-dasharray="2 4" />
                        <g stroke="#FF7186" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            fill="none">

                            <g transform="rotate(0 100 100)">
                                <path d="M100 11 L96 17 L100 23 L104 17 Z" />
                            </g>

                            <g transform="rotate(30 100 100)">
                                <path d="M96 12 L104 12 L100 22 Z" />
                            </g>

                            <g transform="rotate(60 100 100)">
                                <path d="M96 12 L100 17 L104 12 M100 17 L100 23" />
                            </g>

                            <g transform="rotate(90 100 100)">
                                <path d="M96 13 L104 13 M100 13 L100 23" />
                            </g>

                            <g transform="rotate(120 100 100)">
                                <path d="M96 12 L104 22 M104 12 L96 22" />
                            </g>

                            <g transform="rotate(150 100 100)">
                                <path d="M96 12 L104 12 L96 22 L104 22" />
                            </g>

                            <g transform="rotate(180 100 100)">
                                <path d="M100 11 L96 17 L100 23 L104 17 Z" />
                            </g>

                            <g transform="rotate(210 100 100)">
                                <path d="M96 12 L104 12 L100 22 Z" />
                            </g>

                            <g transform="rotate(240 100 100)">
                                <path d="M96 12 L100 17 L104 12 M100 17 L100 23" />
                            </g>

                            <g transform="rotate(270 100 100)">
                                <path d="M96 13 L104 13 M100 13 L100 23" />
                            </g>

                            <g transform="rotate(300 100 100)">
                                <path d="M96 12 L104 22 M104 12 L96 22" />
                            </g>

                            <g transform="rotate(330 100 100)">
                                <path d="M96 12 L104 12 L96 22 L104 22" />
                            </g>
                        </g>
                    </g>

                    <g id="binding_middle_ring">
                        <circle cx="100" cy="100" r="65" fill="none" stroke="#FF7186" stroke-width="1.5" />
                        <path d="M100 35 L156 132 L44 132 Z
                 M100 165 L156 68 L44 68 Z" fill="none" stroke="#FF7186" stroke-width="1.5" />
                        <g fill="none" stroke="#FF7186" stroke-width="1.1" stroke-linejoin="round">

                            <g transform="rotate(0 100 100)">
                                <path d="M100 39 L110 54 L100 69 L90 54 Z" />
                                <path d="M100 39 V69 M94 54 H106" />
                            </g>

                            <g transform="rotate(60 100 100)">
                                <path d="M100 39 L110 54 L100 69 L90 54 Z" />
                                <path d="M100 39 V69 M94 54 H106" />
                            </g>

                            <g transform="rotate(120 100 100)">
                                <path d="M100 39 L110 54 L100 69 L90 54 Z" />
                                <path d="M100 39 V69 M94 54 H106" />
                            </g>

                            <g transform="rotate(180 100 100)">
                                <path d="M100 39 L110 54 L100 69 L90 54 Z" />
                                <path d="M100 39 V69 M94 54 H106" />
                            </g>

                            <g transform="rotate(240 100 100)">
                                <path d="M100 39 L110 54 L100 69 L90 54 Z" />
                                <path d="M100 39 V69 M94 54 H106" />
                            </g>

                            <g transform="rotate(300 100 100)">
                                <path d="M100 39 L110 54 L100 69 L90 54 Z" />
                                <path d="M100 39 V69 M94 54 H106" />
                            </g>
                        </g>
                    </g>

                    <g id="binding_centre">
                        <circle cx="100" cy="100" r="28" fill="none" stroke="#FF9BA9" stroke-width="1.5" />
                        <circle cx="100" cy="100" r="8" fill="#050308" />
                        <g id="binding_centre">
                            <circle cx="100" cy="100" r="28" fill="none" stroke="#FF9BA9" stroke-width="1.5" />
                            <path d="M100 75 L125 100 L100 125 L75 100 Z" fill="none" stroke="#E94B67"
                                stroke-width="1" />

                            <circle cx="100" cy="100" r="18" fill="none" stroke="#FF7186" stroke-width="0.8" />
                            <g fill="#FF7186">
                                <circle cx="100" cy="82" r="1.8" />
                                <circle cx="109" cy="84.4" r="1.8" />
                                <circle cx="115.6" cy="91" r="1.8" />
                                <circle cx="118" cy="100" r="1.8" />
                                <circle cx="115.6" cy="109" r="1.8" />
                                <circle cx="109" cy="115.6" r="1.8" />
                                <circle cx="100" cy="118" r="1.8" />
                                <circle cx="91" cy="115.6" r="1.8" />
                                <circle cx="84.4" cy="109" r="1.8" />
                                <circle cx="82" cy="100" r="1.8" />
                                <circle cx="84.4" cy="91" r="1.8" />
                                <circle cx="91" cy="84.4" r="1.8" />
                            </g>

                            <circle cx="100" cy="100" r="10" fill="#030207" stroke="#FF9BA9" stroke-width="1.2" />

                            <circle cx="100" cy="100" r="5" fill="#000000" />

                        </g>
                    </g>
                </svg>

            </button>

            <button class="library_button" id="library_button" type="button" aria-label="Spell Library">

                <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">

                    <path d="M50 25 C38 18 24 18 12 23 V75
                             C25 70 39 71 50 78
                             C61 71 75 70 88 75 V23
                             C76 18 62 18 50 25 Z" />

                    <path d="M50 25 V78" />
                    <path d="M20 35 C29 32 38 33 43 36" />
                    <path d="M57 36 C66 33 75 32 80 35" />
                    <path d="M20 45 C29 42 38 43 43 46" />
                    <path d="M57 46 C66 43 75 42 80 45" />

                </svg>
            </button>

            <button class="settings_button" id="settings_button" type="button" aria-label="Settings">

                <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"
                    stroke-linecap="round" aria-hidden="true">

                    <circle cx="50" cy="50" r="26" />
                    <circle cx="50" cy="50" r="17" />
                    <circle cx="50" cy="50" r="5" />

                    <defs>
                        <path id="wheel_point" d="M50 24 V14 M46 19 L50 14 L54 19" />
                    </defs>

                    <use href="#wheel_point" />
                    <use href="#wheel_point" transform="rotate(45 50 50)" />
                    <use href="#wheel_point" transform="rotate(90 50 50)" />
                    <use href="#wheel_point" transform="rotate(135 50 50)" />
                    <use href="#wheel_point" transform="rotate(180 50 50)" />
                    <use href="#wheel_point" transform="rotate(225 50 50)" />
                    <use href="#wheel_point" transform="rotate(270 50 50)" />
                    <use href="#wheel_point" transform="rotate(315 50 50)" />
                </svg>

            </button>
        </footer>

    </main>

    <div class="spell_overlay" id="spell_overlay" hidden>
        <div class="spell_banner" id="spell_banner" role="dialog" aria-modal="true" aria-label="Spell details">
            <div class="spell_banner_content" id="spell_banner_content"></div>
        </div>
    </div>

    <div class="settings_overlay" id="settings_overlay" hidden>
        <div class="settings_banner" role="dialog" aria-modal="true" aria-label="Settings">

            <div class="settings_banner_content">
                <h2 class="settings_title">
                    <span>✦</span>
                    SETTINGS
                    <span>✦</span>
                </h2>

                <div class="settings_main">

                    <div class="settings_field"> <label id="character_level_label">Character Level</label>
                        <div class="level_picker" id="level_picker" role="group"
                            aria-labelledby="character_level_label">
                            <div class="level_picker_selection"></div>
                            <div class="level_picker_scroll" id="level_picker_scroll">
                            </div>
                        </div>
                    </div>

                </div>

                <button class="settings_override_button" id="settings_override_button" type="button">
                    ✦ OVERRIDE CONSULTATION ✦
                </button>

                <div class="settings_footer">
                    <p>Twelve voices. One will.</p>
                    <small>THE PATRON · GRIMOIRE I</small>
                </div>

            </div>

        </div>
    </div>

    <div class="manual_overlay" id="manual_overlay" hidden>
        <div class="manual_banner" role="dialog" aria-modal="true" aria-label="Manual Consultation">

            <div class="manual_content">
                <h2 class="manual_title">
                    <span>✦</span>
                    MANUAL CONSULTATION
                    <span>✦</span>
                </h2>

                <div class="manual_slots" id="manual_slots">
                    <button class="manual_slot cantrip" type="button" data-slot="0">
                        <span class="manual_slot_name">×</span>
                        <span class="manual_slot_label">C1</span>
                    </button>

                    <button class="manual_slot cantrip" type="button" data-slot="1">
                        <span class="manual_slot_name">×</span>
                        <span class="manual_slot_label">C2</span>
                    </button>

                    <button class="manual_slot cantrip" type="button" data-slot="2">
                        <span class="manual_slot_name">×</span>
                        <span class="manual_slot_label">C3</span>
                    </button>

                    <button class="manual_slot ritual" type="button" data-slot="3">
                        <span class="manual_slot_name">×</span>
                        <span class="manual_slot_label">R1</span>
                    </button>

                    <button class="manual_slot ritual" type="button" data-slot="4">
                        <span class="manual_slot_name">×</span>
                        <span class="manual_slot_label">R2</span>
                    </button>
                </div>

                <div class="manual_search_section">
                    <input type="search" id="manual_spell_search" placeholder="Search spells..."
                        aria-label="Search manual consultation spells">

                    <div class="manual_spell_list" id="manual_spell_list"></div>
                </div>

                <div class="manual_actions">
                    <button id="manual_clear_button" type="button">
                        CLEAR
                    </button>

                    <button id="manual_apply_button" type="button" disabled>
                        APPLY
                    </button>
                </div>

            </div>

        </div>
    </div>

    <div class="library_overlay" id="library_overlay" hidden>
        <div class="library_warning" id="library_warning" hidden>
            <p id="library_warning_text"></p>
        </div>
        <div class="library_reset_confirmation" id="library_reset_confirmation" role="group"
            aria-label="Confirm Spell Library reset" hidden>

            <h3>✦ RESET? ✦</h3>

            <div class="library_reset_choices">
                <button type="button" id="library_reset_yes">YES</button>
                <button type="button" id="library_reset_no">NO</button>
            </div>

        </div>
        <div class="library_banner" role="dialog" aria-modal="true" aria-label="Spell Library">

            <div class="library_content">
                <button class="library_reset_button" id="library_reset_button" type="button"
                    aria-label="Reset Spell Library">
                    <span class="library_reset_ornament">✦</span>
                    <span>SPELL LIBRARY</span>
                    <span class="library_reset_ornament">✦</span>
                </button>

                <section class="library_sources">
                    <h3>Spell Sources</h3>
                    <div class="library_list" id="spell_sources_list"></div>
                </section>

                <section class="library_exclusions">
                    <h3>Excluded Spells</h3>

                    <input type="search" id="spell_search" placeholder="Search spells..." aria-label="Search spells">

                    <div class="library_list" id="library_exclusions_list"></div>
                </section>
            </div>

        </div>
    </div>

    <template id="spell_card_template">
        <div class="spell_card">
            <div class="card_inner">

                <div class="card_face card_front">
                    <img class="spell_artwork" alt="">

                    <div class="spell_details">
                        <div class="spell_name"></div>

                        <div class="spell_decoration">
                            <span class="decoration_line"></span>
                            <div class="spell_diamonds"></div>
                            <span class="decoration_line"></span>
                        </div>
                    </div>
                </div>

                <div class="card_face card_back">
                    <img class="spell_artwork" src="assets/cards/card_back.png" alt="Unrevealed spell">
                </div>

            </div>
        </div>
    </template>

    <script type="module" src="js/app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service_worker.js")
                    .then(() => {
                        console.log("The Patron: service worker registered.");
                    })
                    .catch((error) => {
                        console.error("Service worker registration failed:", error);
                    });
            });
        }
    </script>

</body>

</html>
